[project]
name = "Curved Surface Reconstraction Library"
version = "1.9.0"
authors = [
  { name="Ahmed H. Hanfy", email="ahmed.hady.hanfy92@gmail.com" },
  { name="Pawel Flaszyński"},
  { name="Piotr Kaczyński"},
  { name="Piotr Doerffer" },
]
description = "Image processing library to flatten uniform curved surfaces using a single camera view in order obtain a true scale-mapped surface of the airfoil. The library uses OpenCV, glob, sys, numpy and matplotlib libraries"
readme = "README.md"
requires-python = ">=3.11"

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = ""
Issues = "/issues"